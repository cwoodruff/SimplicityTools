name: Deploy docs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs-site
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: simplicitytools.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: npm ci

      - name: Sync custom domain artifact
        run: |
          repo_domain="$(tr -d '\r\n' < ../CNAME)"
          if [ "$repo_domain" != "$CUSTOM_DOMAIN" ]; then
            echo "Root CNAME mismatch: expected $CUSTOM_DOMAIN but found ${repo_domain:-<empty>}" >&2
            exit 1
          fi
          printf '%s\n' "$repo_domain" > public/CNAME

      - name: Validate production build
        run: npm run build:validate

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs-site/dist
          cname: ${{ env.CUSTOM_DOMAIN }}
          force_orphan: true
