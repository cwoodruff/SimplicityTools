name: NuGet release pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'sprint/**'
    tags:
      - 'libraries/v*'
      - 'analyzers/v*'
      - 'cli/v*'
  workflow_dispatch:
    inputs:
      release_group:
        description: Package group to build
        type: choice
        required: true
        default: validation
        options:
          - validation
          - libraries
          - analyzers
          - cli
      version:
        description: Optional SemVer override for upload-ready packages (ignored for validation)
        required: false
        type: string

permissions:
  contents: read

# Serialize publish runs; never cancel an in-progress push to NuGet.org.
concurrency:
  group: nuget-publish

env:
  DOTNET_NOLOGO: true
  PACKAGE_OUTPUT_DIR: artifacts/packages

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_group: ${{ steps.release.outputs.release_group }}
      pack_version: ${{ steps.release.outputs.pack_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release shape
        id: release
        shell: bash
        env:
          REQUESTED_GROUP: ${{ github.event.inputs.release_group || 'validation' }}
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          ref_type="${GITHUB_REF_TYPE:-branch}"
          ref_name="${GITHUB_REF_NAME}"
          requested_group="$REQUESTED_GROUP"
          requested_version="$REQUESTED_VERSION"
          semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$'
          canonical_version="$(python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("Directory.Build.props").getroot()

          for element in root.iter():
              if element.tag.split("}", 1)[-1] == "SimplicityToolsReleaseVersion" and element.text:
                  print(element.text.strip())
                  break
          else:
              print("::error::Directory.Build.props is missing SimplicityToolsReleaseVersion.", file=sys.stderr)
              sys.exit(1)
          PY
          )"

          effective_version="$requested_version"
          if [[ "$requested_group" == "validation" ]]; then
            effective_version=""
            if [[ -n "$requested_version" ]]; then
              echo "::notice::Validation runs ignore the optional version input and always use the CI-only package version."
            fi
          fi

          if [[ "$ref_type" == "tag" ]]; then
            if [[ "$ref_name" =~ ^libraries/v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*)$ ]]; then
              echo "release_group=libraries" >> "$GITHUB_OUTPUT"
              echo "pack_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            elif [[ "$ref_name" =~ ^analyzers/v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*)$ ]]; then
              echo "release_group=analyzers" >> "$GITHUB_OUTPUT"
              echo "pack_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            elif [[ "$ref_name" =~ ^cli/v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*)$ ]]; then
              echo "release_group=cli" >> "$GITHUB_OUTPUT"
              echo "pack_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Unsupported tag '$ref_name'. Use libraries/vX.Y.Z, analyzers/vX.Y.Z, or cli/vX.Y.Z."
              exit 1
            fi
          else
            case "$requested_group" in
              validation)
                echo "release_group=validation" >> "$GITHUB_OUTPUT"
                echo "pack_version=${canonical_version}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
                ;;
              libraries|analyzers|cli)
                if [[ -n "$effective_version" ]]; then
                  if [[ ! "$effective_version" =~ $semver_pattern ]]; then
                    echo "::error::Workflow dispatch version must be a SemVer value such as 0.4.0 or 0.4.0-rc.1."
                    exit 1
                  fi

                  echo "release_group=$requested_group" >> "$GITHUB_OUTPUT"
                  echo "pack_version=$effective_version" >> "$GITHUB_OUTPUT"
                else
                  echo "release_group=$requested_group" >> "$GITHUB_OUTPUT"
                  echo "pack_version=$canonical_version" >> "$GITHUB_OUTPUT"
                fi
                ;;
              *)
                echo "::error::Unsupported workflow dispatch release_group '$requested_group'."
                exit 1
                ;;
            esac
          fi

      - name: Restore solution
        run: dotnet restore SimplicityTools.sln --verbosity minimal

      - name: Build solution
        run: dotnet build SimplicityTools.sln --configuration Release --no-restore --verbosity minimal

      - name: Test solution
        run: >
          dotnet test SimplicityTools.sln
          --configuration Release
          --no-build
          --verbosity minimal
          --filter "FullyQualifiedName!~SimplicityTools.Cli.Tests"

      - name: Validate CLI commands
        run: >
          dotnet test tests/SimplicityTools.Cli.Tests/SimplicityTools.Cli.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=detailed"
          --filter "FullyQualifiedName!~SimplicityTools.Cli.Tests.AnalyzeCommandPerformanceTests"

      - name: Validate CLI performance gate
        run: >
          dotnet test tests/SimplicityTools.Cli.Tests/SimplicityTools.Cli.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=detailed"
          --filter "FullyQualifiedName=SimplicityTools.Cli.Tests.AnalyzeCommandPerformanceTests.AnalyzeCommand_OverEngineeredSample_CompletesWithinExpectedThresholdAtP95"

      - name: Pack NuGet artifacts
        shell: bash
        run: |
          mkdir -p "$PACKAGE_OUTPUT_DIR"

          case "${{ steps.release.outputs.release_group }}" in
            libraries)
              projects=(
                src/SimplicityTools.Metrics/SimplicityTools.Metrics.csproj
                src/SimplicityTools.Filters/SimplicityTools.Filters.csproj
                src/SimplicityTools.Tca/SimplicityTools.Tca.csproj
              )
              ;;
            analyzers)
              projects=(
                src/SimplicityTools.Analyzers/SimplicityTools.Analyzers.csproj
              )
              ;;
            cli)
              projects=(
                src/SimplicityTools.Cli/SimplicityTools.Cli.csproj
              )
              ;;
            *)
              projects=(
                src/SimplicityTools.Metrics/SimplicityTools.Metrics.csproj
                src/SimplicityTools.Filters/SimplicityTools.Filters.csproj
                src/SimplicityTools.Tca/SimplicityTools.Tca.csproj
                src/SimplicityTools.Analyzers/SimplicityTools.Analyzers.csproj
                src/SimplicityTools.Cli/SimplicityTools.Cli.csproj
              )
              ;;
          esac

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output "$PACKAGE_OUTPUT_DIR" \
              -p:Version=${{ steps.release.outputs.pack_version }} \
              --verbosity minimal
          done

      - name: Validate packed metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          packages = sorted(glob.glob("artifacts/packages/*.nupkg"))
          if not packages:
              print("No packages were produced.", file=sys.stderr)
              sys.exit(1)

          for package_path in packages:
              package = pathlib.Path(package_path)
              with zipfile.ZipFile(package) as archive:
                  names = set(archive.namelist())
                  if "README.md" not in names:
                      print(f"{package.name} is missing README.md", file=sys.stderr)
                      sys.exit(1)
                  if "simplicitytools-icon.png" not in names:
                      print(f"{package.name} is missing simplicitytools-icon.png", file=sys.stderr)
                      sys.exit(1)

                  nuspec_name = next((name for name in names if name.endswith(".nuspec")), None)
                  if nuspec_name is None:
                      print(f"{package.name} is missing a nuspec file", file=sys.stderr)
                      sys.exit(1)

                  root = ET.fromstring(archive.read(nuspec_name))

                  def local_name(tag):
                      return tag.split("}", 1)[-1]

                  metadata = next((child for child in root if local_name(child.tag) == "metadata"), None)
                  if metadata is None:
                      print(f"{package.name} is missing nuspec metadata", file=sys.stderr)
                      sys.exit(1)

                  required = {
                      "authors": "Authors",
                      "description": "Description",
                      "license": "License",
                      "projectUrl": "Package project URL",
                      "repository": "Repository metadata",
                      "icon": "Package icon"
                  }

                  for tag_name, label in required.items():
                      if not any(local_name(child.tag) == tag_name for child in metadata):
                          print(f"{package.name} is missing {label}", file=sys.stderr)
                          sys.exit(1)

              symbol_package = package.with_suffix(".snupkg")
              if not symbol_package.exists():
                  print(f"{package.name} is missing matching symbol package {symbol_package.name}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Validate analyzer consumer package
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import textwrap
          import xml.etree.ElementTree as ET
          import zipfile

          packages = sorted(glob.glob("artifacts/packages/SimplicityTools.Analyzers.*.nupkg"))
          if not packages:
              print("No analyzer package produced in this run; skipping analyzer consumer validation.")
              raise SystemExit(0)

          package = pathlib.Path(packages[0])
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              required_entries = {
                  "analyzers/dotnet/cs/SimplicityTools.Analyzers.dll",
              }
              missing = sorted(required_entries - names)
              if missing:
                  print(f"{package.name} is missing analyzer assets: {', '.join(missing)}", file=sys.stderr)
                  sys.exit(1)
              if any(name.startswith("lib/") for name in names):
                  print(f"{package.name} incorrectly ships compiler assets under lib/", file=sys.stderr)
                  sys.exit(1)

              nuspec_name = next((name for name in names if name.endswith(".nuspec")), None)
              if nuspec_name is None:
                  print(f"{package.name} is missing a nuspec file", file=sys.stderr)
                  sys.exit(1)

              root = ET.fromstring(archive.read(nuspec_name))

              def local_name(tag):
                  return tag.split("}", 1)[-1]

              metadata = next((child for child in root if local_name(child.tag) == "metadata"), None)
              if metadata is None:
                  print(f"{package.name} is missing nuspec metadata", file=sys.stderr)
                  sys.exit(1)

              development_dependency = next((child.text for child in metadata if local_name(child.tag) == "developmentDependency"), None)
              if development_dependency != "true":
                  print(f"{package.name} must set developmentDependency=true for IDE-only consumption.", file=sys.stderr)
                  sys.exit(1)

              if any(local_name(child.tag) == "dependencies" for child in metadata):
                  print(f"{package.name} must not expose NuGet dependencies from the analyzer package.", file=sys.stderr)
                  sys.exit(1)

          validation_root = pathlib.Path("artifacts/analyzer-consumer-validation")
          if validation_root.exists():
              shutil.rmtree(validation_root)
          package_source = validation_root / "packages"
          global_packages = validation_root / "global-packages"
          consumer_root = validation_root / "consumer"
          package_source.mkdir(parents=True, exist_ok=True)
          global_packages.mkdir(parents=True, exist_ok=True)
          consumer_root.mkdir(parents=True, exist_ok=True)

          destination = package_source / package.name
          destination.write_bytes(package.read_bytes())

          (consumer_root / "Consumer.csproj").write_text(textwrap.dedent(f"""
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <TargetFramework>net10.0</TargetFramework>
                  <ImplicitUsings>enable</ImplicitUsings>
                  <Nullable>enable</Nullable>
                </PropertyGroup>
                <ItemGroup>
                  <PackageReference Include="SimplicityTools.Analyzers" Version="{package.stem.removeprefix('SimplicityTools.Analyzers.')}" />
                </ItemGroup>
              </Project>
              """).strip() + "\n", encoding="utf-8")

          (consumer_root / "Feature.cs").write_text(textwrap.dedent("""
              namespace Consumer;

              public interface IPricer
              {
                  decimal Price();
              }

              public sealed class DefaultPricer : IPricer
              {
                  public decimal Price() => 12m;
              }
              """).strip() + "\n", encoding="utf-8")

          env = os.environ.copy()
          env["NUGET_PACKAGES"] = str(global_packages.resolve())
          build = subprocess.run(
              [
                  "dotnet",
                  "build",
                  "Consumer.csproj",
                  "--verbosity",
                  "minimal",
                  f"-p:RestoreAdditionalProjectSources={package_source.resolve()}",
              ],
              cwd=consumer_root,
              env=env,
              text=True,
              capture_output=True,
          )

          output = f"{build.stdout}\n{build.stderr}"
          if build.returncode != 0:
              print(output, file=sys.stderr)
              sys.exit(build.returncode)
          if "warning SF0001" not in output:
              print(output, file=sys.stderr)
              print("Analyzer consumer build did not emit SF0001.", file=sys.stderr)
              sys.exit(1)

          assets = json.loads((consumer_root / "obj" / "project.assets.json").read_text(encoding="utf-8"))
          target_package = None
          for target in assets["targets"].values():
              for name, data in target.items():
                  if name.startswith("SimplicityTools.Analyzers/"):
                      target_package = data
                      break
              if target_package is not None:
                  break

          if target_package is None:
              print("Analyzer package was not restored into the consumer assets graph.", file=sys.stderr)
              sys.exit(1)

          for forbidden in ("compile", "runtime", "dependencies"):
              if forbidden in target_package:
                  print(f"Analyzer package should not expose '{forbidden}' assets to the consumer compile graph.", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ steps.release.outputs.release_group }}-${{ steps.release.outputs.pack_version }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ needs.validate.outputs.release_group }}-${{ needs.validate.outputs.pack_version }}
          path: artifacts/packages

      - name: Validate publishable artifacts
        shell: bash
        env:
          EXPECTED_RELEASE_GROUP: ${{ needs.validate.outputs.release_group }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.pack_version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          expected_release_group = os.environ["EXPECTED_RELEASE_GROUP"]
          expected_version = os.environ["EXPECTED_VERSION"]
          package_dir = pathlib.Path("artifacts/packages")

          expected_ids_by_group = {
              "libraries": {
                  "SimplicityTools.Metrics",
                  "SimplicityTools.Filters",
                  "SimplicityTools.Tca",
              },
              "analyzers": {
                  "SimplicityTools.Analyzers",
              },
              "cli": {
                  "SimplicityTools.Cli",
              },
          }

          if expected_release_group not in expected_ids_by_group:
              print(f"Unsupported release group '{expected_release_group}' for publish validation.", file=sys.stderr)
              sys.exit(1)

          packages = sorted(
              package
              for package in package_dir.glob("*.nupkg")
              if not package.name.endswith(".symbols.nupkg")
          )

          if not packages:
              print("No NuGet packages found to publish.", file=sys.stderr)
              sys.exit(1)

          actual_ids = set()

          def local_name(tag):
              return tag.split("}", 1)[-1]

          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  nuspec_name = next((name for name in archive.namelist() if name.endswith(".nuspec")), None)
                  if nuspec_name is None:
                      print(f"{package.name} is missing a nuspec file.", file=sys.stderr)
                      sys.exit(1)

                  root = ET.fromstring(archive.read(nuspec_name))

              metadata = next((child for child in root if local_name(child.tag) == "metadata"), None)
              if metadata is None:
                  print(f"{package.name} is missing nuspec metadata.", file=sys.stderr)
                  sys.exit(1)

              package_id = next((child.text for child in metadata if local_name(child.tag) == "id"), None)
              package_version = next((child.text for child in metadata if local_name(child.tag) == "version"), None)

              if package_id is None or package_version is None:
                  print(f"{package.name} is missing package identity metadata.", file=sys.stderr)
                  sys.exit(1)

              if package_version != expected_version:
                  print(
                      f"{package.name} version '{package_version}' does not match expected release version '{expected_version}'.",
                      file=sys.stderr)
                  sys.exit(1)

              if ".ci." in package_version or package_version.endswith("-local"):
                  print(f"{package.name} still looks like a validation-only package version.", file=sys.stderr)
                  sys.exit(1)

              symbol_package = package.with_suffix(".snupkg")
              if not symbol_package.exists():
                  print(f"{package.name} is missing matching symbol package {symbol_package.name}.", file=sys.stderr)
                  sys.exit(1)

              actual_ids.add(package_id)

          expected_ids = expected_ids_by_group[expected_release_group]
          if actual_ids != expected_ids:
              print(
                  f"Publish artifact set mismatch. Expected {sorted(expected_ids)}, found {sorted(actual_ids)}.",
                  file=sys.stderr)
              sys.exit(1)
          PY

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::NUGET_API_KEY is not configured."
            exit 1
          fi

          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg)

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No NuGet packages found to publish."
            exit 1
          fi

          for package in "${packages[@]}"; do
            if [[ "$package" == *.symbols.nupkg ]]; then
              continue
            fi

            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
